[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "esper"
version = "0.1.0"
description = "Collect alpinac peak extraction results into a SQLite database and browse them."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Lionel Constantin", email = "lionel.constantin@empa.ch" }]
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "xarray",
    "h5netcdf",
    "PySide6",
    "pyqtgraph",
    "jcamp",
    "pyyaml",
    "scipy",
    "peaxart @ git+https://github.com/lionel42/peaxart.git",
    # h5 files: spectra, timing, where the calibration files are (esper.mass_cal, esper.calibrate)
    "twutils @ git+https://github.com/lionel42/twutils.git",
    # Mass calibration: fit, files, plots (esper calibrate)
    "masscal @ git+https://github.com/lionel42/masscal.git",
]

[project.optional-dependencies]
# plots of the mass calibration (esper calibrate --plots, esper plot-calibration)
plots = ["matplotlib>=3.6"]

[project.scripts]
esper = "esper.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
esper = ["resources/*.svg"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
